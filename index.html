    <!--
      Ce petit script s'exécute AVANT l'affichage de la page :
      1. il ajoute la classe "js" (les animations ne cachent rien si JavaScript est coupé) ;
      2. il applique le thème choisi (sauvegardé) ou celui du système, pour éviter un éclair blanc.
    -->
    <script>
      (function () {
        var root = document.documentElement
        root.classList.add('js')
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body class="min-w-[320px] bg-paper font-body text-ink antialiased [font-synthesis:none] [-webkit-tap-highlight-color:transparent] [&_:focus-visible]:outline-2 [&_:focus-visible]:outline-offset-4 [&_:focus-visible]:outline-focus">
    <div id="root"></div>
    <noscript>Ce portfolio a besoin de JavaScript pour s’afficher. Merci de l’activer.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
